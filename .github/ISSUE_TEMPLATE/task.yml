name: Tarefa / Task
description: Manutenção, documentação, dívida técnica ou decisão pendente / Maintenance, docs, tech debt or a pending decision
body:
  - type: dropdown
    id: type
    attributes:
      label: Tipo / Type
      description: Aplique a label correspondente / Apply the matching label
      options:
        - "type:chore — manutenção, CI, dependências / maintenance"
        - "type:docs — documentação / documentation"
        - "type:question — precisa de resposta / needs an answer"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto / Context
      description: Por que isso precisa ser feito / Why this needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Pronto quando / Done when
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Referências / References
      description: Auditoria, PR, ADR, achado / Audit, PR, ADR, finding
